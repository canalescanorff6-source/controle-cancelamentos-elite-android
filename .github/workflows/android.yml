name: Android | Testes e APK V3.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Testar e compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Conferir projeto e impedir arquivos sensíveis
        run: |
          python3 tools/check_source.py
          git diff --check

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK atualizado
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma e ferramentas de build
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Configurar Gradle 8.13 com cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Testes unitários Android/JVM
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Compilar APK instalável de depuração
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar artefato APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee app-debug.apk.sha256
          ls -lh "$apk"

      - name: Publicar APK somente após build aprovado
        uses: actions/upload-artifact@v4
        with:
          name: Controle-Cancelamentos-Elite-V3.2-Teste-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Guardar relatório de testes (inclusive em falhas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-android
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
